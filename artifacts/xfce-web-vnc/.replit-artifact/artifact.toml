kind = "web"
previewPath = "/"
title = "XFCE Web VNC"
description = "A self-contained browser desktop client for launching and viewing a local XFCE session through a custom VNC-style interface, with connection status, performance telemetry, and a responsive remote canvas."
version = "1.0.0"
id = "artifacts/xfce-web-vnc"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23577

[services.development]
run = "pnpm --filter @workspace/xfce-web-vnc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xfce-web-vnc", "run", "build" ]
serve = "static"
publicDir = "artifacts/xfce-web-vnc/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23577"
BASE_PATH = "/"
